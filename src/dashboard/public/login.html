<!doctype html>
<html lang="fr" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connexion Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      html {
        color-scheme: dark;
      }
      body {
        background:
          linear-gradient(180deg, rgba(88, 28, 135, 0.2), rgba(2, 6, 23, 0) 360px),
          #020617;
      }
      .field {
        width: 100%;
        border-radius: 0.75rem;
        border: 1px solid rgba(148, 163, 184, 0.18);
        background: rgba(2, 6, 23, 0.72);
        padding: 0.85rem 0.95rem;
        color: rgb(241, 245, 249);
        outline: none;
      }
      .field:focus {
        border-color: rgba(139, 92, 246, 0.82);
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.16);
      }
    </style>
  </head>
  <body class="min-h-full text-slate-100 antialiased">
    <main class="flex min-h-screen items-center justify-center px-5 py-10">
      <section class="w-full max-w-md rounded-xl border border-slate-800 bg-slate-900/80 p-7 shadow-2xl shadow-black/40">
        <div class="mb-8 flex items-center gap-3">
          <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-violet-600 text-white shadow-lg shadow-violet-950/40">
            <i data-lucide="bot" class="h-5 w-5"></i>
          </div>
          <div>
            <h1 class="text-xl font-semibold text-white">EatSmart Admin</h1>
            <p class="text-sm text-slate-400">Panel de configuration</p>
          </div>
        </div>

        <form id="loginForm" class="space-y-4">
          <label class="block">
            <span class="mb-2 block text-sm font-medium text-slate-300">Mot de passe</span>
            <input id="password" class="field" type="password" autocomplete="current-password" required autofocus />
          </label>
          <button class="flex w-full items-center justify-center gap-2 rounded-xl bg-violet-600 px-4 py-3 font-semibold text-white shadow-lg shadow-violet-950/30 transition hover:bg-violet-500" type="submit">
            <i data-lucide="log-in" class="h-4 w-4"></i>
            Connexion
          </button>
          <p id="error" class="hidden rounded-xl border border-red-500/30 bg-red-950/40 px-3 py-2 text-sm text-red-200"></p>
        </form>
      </section>
    </main>

    <script>
      lucide.createIcons();
      const form = document.querySelector('#loginForm');
      const error = document.querySelector('#error');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        error.classList.add('hidden');
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.querySelector('#password').value }),
        });
        if (response.ok) {
          window.location.href = '/';
          return;
        }
        const data = await response.json().catch(() => ({}));
        error.textContent = data.error || 'Connexion impossible.';
        error.classList.remove('hidden');
      });
    </script>
  </body>
</html>
