<!doctype html>
<html lang="fr" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EatSmart Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="/admin/app.js"></script>
    <style>
      html {
        color-scheme: dark;
      }
      body {
        background:
          linear-gradient(180deg, rgba(88, 28, 135, 0.18), rgba(2, 6, 23, 0) 340px),
          #020617;
      }
      .soft-panel {
        background: rgba(15, 23, 42, 0.76);
        border: 1px solid rgba(148, 163, 184, 0.14);
        box-shadow: 0 18px 70px rgba(0, 0, 0, 0.28);
      }
      .field {
        width: 100%;
        border-radius: 0.75rem;
        border: 1px solid rgba(148, 163, 184, 0.18);
        background: rgba(2, 6, 23, 0.72);
        padding: 0.75rem 0.875rem;
        color: rgb(241, 245, 249);
        outline: none;
      }
      .field:focus {
        border-color: rgba(139, 92, 246, 0.82);
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.16);
      }
      .toggle:checked {
        background-color: rgb(124, 58, 237);
      }
    </style>
  </head>
  <body class="min-h-full text-slate-100 antialiased">
    <div id="app" class="min-h-screen"></div>
    <div id="toast" class="fixed bottom-5 right-5 z-50 hidden max-w-sm rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-sm text-slate-100 shadow-2xl shadow-violet-950/30"></div>
  </body>
</html>
