# fly.toml app configuration file generated for eatsmart on 2026-05-26T09:09:26Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'eatsmart'
primary_region = 'cdg'

[build]

[[mounts]]
  source = 'data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512